name: StillWant

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_LANGUAGE: en
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: 1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  StillWant:
    type: application
    platform: iOS
    sources:
      - path: StillWant/App
      - path: StillWant/Models
      - path: StillWant/Services
      - path: StillWant/Views
      - path: StillWant/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: StillWant
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        PRODUCT_BUNDLE_IDENTIFIER: com.9uile.stillwant
        PRODUCT_NAME: StillWant
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
        TARGETED_DEVICE_FAMILY: 1

  StillWantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StillWantTests
    dependencies:
      - target: StillWant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.9uile.stillwant.tests

schemes:
  StillWant:
    build:
      targets:
        StillWant: all
        StillWantTests:
          - test
    run:
      config: Debug
      storeKitConfiguration: StillWant/Resources/StillWant.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StillWantTests
